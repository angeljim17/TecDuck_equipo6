<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <base href="/pages/">
  <title>Inicio — Physics Quest</title>
  <style>body.page-home.is-page-loading{background:#020617;overflow:hidden;min-height:100vh}</style>
