<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/pages/">
  <title>Tienda</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/game-bg.css">
  <link rel="stylesheet" href="../css/ui-toast.css">
  <link rel="stylesheet" href="../css/page-load-overlay.css">
  <link rel="stylesheet" href="../css/shop.css">
</head>
<body class="page-shop is-page-loading">
  <div
    id="page-loading-mount"
    hidden
    data-main="Cargando la tienda"
    data-sub="Preparando artículos y tu saldo…"
    data-label="Cargando tienda"
  ></div>
  <!-- Cabecera con saldo de monedas -->
  <div class="shop-header">
    <span class="shop-title">Tienda</span>
    <span id="shop-coins" class="shop-coins">🪙 <span id="coins-value">0</span></span>
  </div>

  <p class="shop-intro">
    Todo lo que compres aquí se desbloquea en <strong>Mi pato</strong>.
  </p>

  <!-- Navegación: personalizar pato o volver a temas -->
  <nav class="shop-top-nav" aria-label="Navegación de la tienda">
    <a href="topics.html" class="shop-nav-btn shop-nav-btn-temas" data-volver-temas="1">
      <svg class="shop-nav-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      <span class="shop-nav-label">Volver a temas</span>
    </a>
    <a href="customize.html" class="shop-nav-btn shop-nav-btn-mipato">Personalizar pato</a>
  </nav>

  <!-- Catálogo de artículos (se llena por JS) -->
  <div class="shop-items" id="shop-grid"></div>

  <!-- Scripts: economía del pato y tienda -->
  <script src="../js/app-bootstrap.js" data-preset="alumno-base" data-page="../js/shop.js"></script>
</body>
</html>
